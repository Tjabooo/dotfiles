# ~/.config/hypr/hypridle.conf  —  laptop. Runs as hypridle.service (neon-session.target).
# Fullscreen windows (movies, YouTube) block all of this via the idle_inhibit window rule.
# The Waybar wake button also blocks all automatic idle actions via systemd.
#
#   2.5 min  dim to 10 %  (your own brightness comes back on any input, instead of a fixed 50 %)
#   5 min    lock
#   5.5 min  screen off   (OLED: nothing static burning in)
#   15 min   suspend, ON BATTERY ONLY: on AC builds, downloads and ssh sessions keep running

general {
    # The Waybar wake service holds a systemd idle inhibitor.
    ignore_systemd_inhibit = false
    lock_cmd = pidof hyprlock || hyprlock
    # Run hyprlock directly: hypridle runs as a user service outside the tty1 session, and logind
    # resolves its "auto" session to whichever tty session came first at boot, so Lock signals from
    # loginctl lock-session can miss it. hypridle still delays sleep until the session is locked.
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900
    on-timeout = [ "$(cat /sys/class/power_supply/AC0/online)" = 0 ] && systemctl suspend
}
