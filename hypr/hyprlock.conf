# ~/.config/hypr/hyprlock.conf  —  "midnight neon" deck: the password sits in a square eww-style
# card (3px violet bar on top, small bold uppercase tags), like neon/eww and rofi/deck.rasi
$font  = JetBrainsMono Nerd Font
$text  = rgba(e0e0f0ff)
$muted = rgba(babbf1aa)

general {
    hide_cursor = true
    grace = 0
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/eva_lock4.jpg
    # path = ~/.config/hypr/wallpapers/nerv_lock2.jpg
    blur_passes = 3
    blur_size = 6
    contrast = 0.8
    brightness = 0.55
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# ── Time ────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 110
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_color = rgba(9b5de566)
    position = 0, 220
    halign = center
    valign = center
}

# ── Date ────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%^A  %d %^B"
    color = rgba(f15bb5ff)
    font_size = 15
    font_family = $font ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

# ── Weather ─────────────────────────────────────────
label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/scripts/get_weather.sh
    color = $muted
    font_size = 15
    font_family = $font
    position = 0, 75
    halign = center
    valign = center
}

# ── Deck card + password ────────────────────────────
shape {
    monitor =
    size = 440, 176
    color = rgba(0f0f1ef2)
    rounding = 0
    border_size = 1
    border_color = rgba(2a2a45ff)
    position = 0, -72
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 440, 3
    color = rgba(9b5de5ff)
    rounding = 0
    border_size = 0
    position = 0, 15
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:0] echo "<span weight='800' foreground='##9b5de5'>LOCKED</span>   <span weight='700' foreground='##f15bb5'>$(tr a-z A-Z < /etc/hostname)</span>"
    color = $text
    font_size = 11
    font_family = $font
    position = 0, -12
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 392, 46
    position = 0, -64
    halign = center
    valign = center
    zindex = 2
    rounding = 0
    outline_thickness = 2
    outer_color = rgba(2a2a45ff)
    inner_color = rgba(1a1a2fff)
    font_color = $text
    check_color = rgba(9b5de5ff)
    fail_color = rgba(f15bb5ff)
    capslock_color = rgba(ffc371ff)
    fade_on_empty = false
    dots_center = true
    dots_spacing = 0.35
    dots_size = 0.2
    dots_rounding = 0
    font_family = $font
    placeholder_text = <span foreground="##6c6c8a">PASSWORD  ·  $USER</span>
    fail_text = <span foreground="##f15bb5">$FAIL  ($ATTEMPTS)</span>
    hide_input = false
}

label {
    monitor =
    text = ENTER UNLOCK  ·  ESC CLEARS
    color = rgba(6c6c8aff)
    font_size = 8
    font_family = $font Bold
    position = 0, -126
    halign = center
    valign = center
    zindex = 2
}

# ── Bottom bar: layout + battery ───────────────────
label {
    monitor =
    text = <span foreground="##6c6c8a" weight="800">KB</span>  $LAYOUT
    color = $muted
    font_size = 13
    font_family = $font
    position = -40, 30
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] echo "<span foreground='##6c6c8a' weight='800'>BAT</span>  $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $muted
    font_size = 13
    font_family = $font
    position = -110, 30
    halign = right
    valign = bottom
}
