# ~/.config/hypr/hyprlock.conf  —  "midnight neon"
$font  = JetBrainsMono Nerd Font
$text  = rgba(e0e0f0ff)
$muted = rgba(babbf1aa)

general {
    hide_cursor = true
    grace = 0
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/eva_lock4.jpg
    # path = ~/.config/hypr/wallpapers/nerv_lock2.jpg
    blur_passes = 3
    blur_size = 6
    contrast = 0.8
    brightness = 0.55
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# ── Time ────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 110
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_color = rgba(9b5de566)
    position = 0, 220
    halign = center
    valign = center
}

# ── Date ────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(f15bb5ff)
    font_size = 20
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

# ── Weather ─────────────────────────────────────────
label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/scripts/get_weather.sh
    color = $muted
    font_size = 15
    font_family = $font
    position = 0, 75
    halign = center
    valign = center
}

# ── Password ────────────────────────────────────────
input-field {
    monitor =
    size = 300, 56
    position = 0, -60
    halign = center
    valign = center
    rounding = -1
    outline_thickness = 3
    outer_color = rgba(9b5de5ee) rgba(f15bb5ee) 45deg
    inner_color = rgba(0f0f1ecc)
    font_color = $text
    check_color = rgba(00c6ffee) rgba(9b5de5ee) 45deg
    fail_color = rgba(ff5252ee)
    capslock_color = rgba(ffc371ee)
    fade_on_empty = false
    dots_center = true
    dots_spacing = 0.3
    dots_size = 0.22
    font_family = $font
    placeholder_text = <span foreground="##babbf1aa">  $USER</span>
    fail_text = <span foreground="##ff5252">$FAIL ($ATTEMPTS)</span>
    hide_input = false
}

# ── Bottom bar: layout + battery ───────────────────
label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 13
    font_family = $font
    position = -40, 30
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] echo "  $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $muted
    font_size = 13
    font_family = $font
    position = -100, 30
    halign = right
    valign = bottom
}
