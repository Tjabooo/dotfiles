# monitor=,preferred,auto,1

# default mode, 120hz & 60hz
monitor=eDP-1,2880x1800@120,0x0,1.5,bitdepth,10,cm,srgb
#monitor=eDP-1,2880x1800@60,0x0,1.5,bitdepth,10,cm,srgb

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=pkexec /usr/local/bin/swhkd-wrapper
exec-once=$HOME/.config/hypr/autostart
exec-once=[workspace 9 silent] spotify --useFeatures=UseOzonePlatform --ozone-platform=wayland
exec-once=[workspace 10 silent] alacritty -e zsh -c 'cd ~/.config/hypr/scripts && ./launch_lemonade'
#exec-once=[workspace 2 silent] /usr/bin/zeditor

env=HYPRLAND_USE_NO_VFR,1
env=HYPRLAND_USE_FRACTIONAL_SCALE,1

input {
    kb_layout=us,se
    kb_options=grp:win_space_toggle,fkeys:basic_13-24
    follow_mouse=1
    #force_no_accel=true :(
    touchpad {
        natural_scroll=no
        scroll_factor=0.2
        disable_while_typing=true
    }
}

xwayland {
    force_zero_scaling = true
}

device {
    name=asup1207:00-093a:3012-touchpad
    sensitivity=0.2
}

device {
    name=razer-razer-viper-v3-pro
    sensitivity=-0.5
}

misc {
    disable_hyprland_logo = true
}

cursor {
    no_hardware_cursors=true
}

general {
    
    gaps_in=8
    gaps_out=15
    border_size=3
    col.active_border=0xE6babbf1
    # col.active_border 0xE6FFFFFF
    col.inactive_border=0x00ffffff
}

decoration {
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }
    rounding = 4
}

animations {
    enabled=1
    # bezier=overshot,0.05,0.9,0.1,1.1
    bezier=overshot,0.13,0.99,0.29,1.1
    animation=windows,1,3,overshot,slide
    animation=border,1,6,default
    animation=fade,1,6,default
    animation=workspaces,1,3,default
}

master{
    
}

gestures {
    workspace_swipe=yes
    workspace_swipe_fingers=3
}

# example window rules
# for windows named/classed as abc and xyz
#windowrule=move 69 420,abc
windowrule=move center,title:^(fly_is_kitty)$
windowrule=size 800 500,title:^(fly_is_kitty)$
windowrule=animation slide,title:^(all_is_kitty)$
windowrule=float,title:^(all_is_kitty)$
#windowrule=tile,xy
windowrule=tile,title:^(kitty)$
windowrule=float,title:^(fly_is_kitty)$
windowrule=float,title:^(clock_is_kitty)$
windowrule=size 418 234,title:^(clock_is_kitty)$
#windowrule=pseudo,abc
#windowrule=monitor 0,xyz
windowrulev2=opacity 0.8 0.8,class:^(Code)$
windowrulev2=opacity 0.85 0.85,class:^(discord)$
# windowrulev2=opacity 0.8 0.8,class:^(Alacritty)$
windowrulev2=opacity 0.8 0.8,class:^(Spotify)$
windowrulev2=opacity 0.8 0.8,class:^(dev.zed.Zed)$

# example binds
bindm=SUPER,mouse:272,movewindow
bindm=SUPER,mouse:273,resizewindow
bindm=ALT,mouse:272,resizewindow

# bind=SUPER,t,exec,alacritty --start-as=fullscreen -o 'font_size=25' --title all_is_kitty
bind=SUPER,t,exec,alacritty
bind=SUPER,D,exec,discord-canary --enable-features=UseOzonePlatform --ozone-platform=wayland
bind=SUPER,C,exec,code --enable-features=UseOzonePlatform --ozone-platform=wayland
bind=SUPER,B,exec,firefox
bind=SUPER,Z,exec,/usr/bin/zeditor
bind=SUPER,P,exec,parsecd
bind=SUPER,O,exec,obsidian
bind=SUPER,I,exec,intellij-idea-ultimate-edition
bind=SUPER,K,exec,flatpak run com.usebottles.bottles
bind=SUPER_SHIFT,C,exec,cursor --enable-features=UseOzonePlatform --ozone-platform=wayland
bind=ALT,RETURN,exec,alacritty --single-instance
bind=ALT,Print,exec,hyprshot -m window --clipboard-only
bind=,Print,exec,hyprshot -m output --clipboard-only
bind=SUPER,`,exec,killall DiscordCanary
bind=CTRL,Q,killactive,
bind=SUPER,M,exec,hyprlock
bind=SUPER,E,exec,nautilus
bind=SUPER,S,togglefloating,
bind=SUPER,F,fullscreen,
bind=SUPER,R,exec,wofi --show drun

bind=SUPER,L,exec,~/.config/hypr/scripts/lock
bind=,power-button,exec,hyprlock && systemctl suspend

bind=SUPER,left,movefocus,l
bind=SUPER,right,movefocus,r
bind=SUPER,up,movefocus,u
bind=SUPER,down,movefocus,d

bind=SUPER,1,workspace,1
bind=SUPER,2,workspace,2
bind=SUPER,3,workspace,3
bind=SUPER,4,workspace,4
bind=SUPER,5,workspace,5
bind=SUPER,6,workspace,6
bind=SUPER,7,workspace,7
bind=SUPER,8,workspace,8
bind=SUPER,9,workspace,9
bind=SUPER,0,workspace,10

bind=,XF86MonBrightnessUp,exec,sh ~/.config/hypr/scripts/raisebrightness.sh
bind=,XF86MonBrightnessDown,exec,sh ~/.config/hypr/scripts/lowerbrightness.sh
bind=,XF86AudioLowerVolume,exec,sh ~/.config/hypr/scripts/lowervolume.sh
bind=,XF86AudioRaiseVolume,exec,sh ~/.config/hypr/scripts/raisevolume.sh
bind=,XF86AudioMute,exec,sh ~/.config/hypr/scripts/togglemute.sh
bindl=,XF86AudioMicMute,exec,pamixer --default-source --toggle-mute

bind=ALT,1,movetoworkspace,1
bind=ALT,2,movetoworkspace,2
bind=ALT,3,movetoworkspace,3
bind=ALT,4,movetoworkspace,4
bind=ALT,5,movetoworkspace,5
bind=ALT,6,movetoworkspace,6
bind=ALT,7,movetoworkspace,7
bind=ALT,8,movetoworkspace,8
bind=ALT,9,movetoworkspace,9
bind=ALT,0,movetoworkspace,10

bind=SUPER,mouse_down,workspace,e+1
bind=SUPER,mouse_up,workspace,e-1

bind=SUPER,g,togglegroup
bind=SUPER,tab,changegroupactive

bind=,Print,exec,grim -g "$(slurp)" - | swappy -f -
bind=SUPER_SHIFT,F23,exec,gaiaui

