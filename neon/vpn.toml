# neon-vpn (Mullvad) on unit-01. `neon-vpn setup` applies [relay] + [settings] to the Mullvad daemon;
# neon-vpn.service (the watcher) handles DNS, notifications and the waybar state.

waybar_signal = 15          # 8 and 9 are taken
drop_grace = 8

[relay]
location = ["se", "sto"]    # Stockholm
ownership = "owned"         # Mullvad-owned servers only

[settings]
auto_connect = true
lockdown = true             # the laptop travels: no internet unless the VPN is up (LAN still works)
lan = true                  # SSH, Lilin, Archfleet, clipboard bridge on the home network
quantum_resistant = true
daita = true
daita_direct_only = true

[dns]
home = ["192.168.50.67"]    # AdGuard Home on the server, only while on the home network
# home_gateway_mac: taken from ~/.config/lilin-house.env (HOME_GW_MAC)
away_block = ["ads", "trackers", "malware"]   # Mullvad DNS content blocking everywhere else

[split]
# process names kept outside the tunnel (with their children) by `neon-vpn exclude-running`; the launchers
# start them through `neon-vpn exclude`. Discord: Cloudflare 403s Mullvad exits ("Network Error" window).
# Excluded apps still work with lockdown on; everything else stays in the tunnel.
apps = ["Discord", "discord"]
# sites that refuse Mullvad exits: the browser reaches them outside the tunnel through the bypass proxy
# (`vpn-site add|rm|list|test DOMAIN` edits this; a localhost SOCKS5 proxy only connects to these, rest stays in the tunnel).
# Amazon: "Ett oväntat fel har inträffat" on most loads from Mullvad (2026-11-11).
sites = ["amazon.se", "amazon.com", "amazon.co.uk", "amazon.de", "amazon.fr", "amazon.it", "amazon.es",
         "amazon.nl", "amazon.pl", "amazon.eu", "media-amazon.com", "ssl-images-amazon.com",
         "images-amazon.com", "awswaf.com", "a2z.com"]

[competitive]
action = "none"
