# npukit on unit-01 (defaults: ~/workspace/npukit/config.example.toml)

[server]
# FLM 1.0.12 portable build (embed-gemma fixes) until Arch packages it; then drop this line
flm = "~/.local/share/fastflowlm/1.0.12/flm"

[models.aliases]
fast = "qwen3.5:4b"
quality = "gpt-oss:20b"
vision = "qwen3.5:4b"      # shares the chat model: no swap between OCR and chat

[translate]
# SUPER+CTRL+T overlay; Esc via the "npu-translate" submap in hyprland.lua
on_open = ["hyprctl", "dispatch", 'hl.dsp.submap("npu-translate")']
on_close = ["hyprctl", "dispatch", 'hl.dsp.submap("reset")']
languages = ["English", "Swedish", "German", "French", "Spanish", "Japanese"]
colors = { bg = "#0f0f1e", panel = "#1a1a2f", line = "#2a2a45", fg = "#e0e0f0", dim = "#6c6c8a", accent = "#9b5de5", accent2 = "#f15bb5", error = "#ff5c8a" }

[ui]
menu_theme = "~/.config/rofi/npu.rasi"
search_theme = "~/.config/rofi/npu-search.rasi"
lang_theme = "~/.config/rofi/npu-lang.rasi"

[search]
# notes = the agent-mesh memory + Documents; code = ~/workspace
roots = ["~/workspace", "~/Documents", "~/.agent-mesh/memory"]
exclude_globs = ["*.min.*", "*.map", "*-lock.json", "*.lock", "*/third_party/*", "*/external/*",
                 "*/site-packages/*", "*/wp-includes/*", "*/wp-admin/*", "*/wp-content/*",
                 "*/engine/include/*"]
open = ["code", "-g", "{path}:{line}"]
