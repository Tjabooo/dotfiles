[general]
fullscreen = false
early-exit = true                 # close after copying/saving
corner-roundness = 12
initial-tool = "arrow"
copy-command = "wl-copy"
annotation-size-factor = 1.5
output-filename = "~/Pictures/Screenshots/%Y-%m-%d_%H-%M-%S.png"
actions-on-enter = ["save-to-clipboard"]
actions-on-escape = ["exit"]
# satty's default "screenshot" thumbnail is a temp file deleted the moment satty exits
# (early-exit): dunst + glycin then segfaults loading it. app-icon = no temp file.
notification-thumbnail = "app-icon"

[font]
family = "JetBrainsMono Nerd Font"

[color-palette]
palette = ["#f15bb5", "#9b5de5", "#00c6ff", "#ffc371", "#81c784", "#ff5252", "#ffffff"]
