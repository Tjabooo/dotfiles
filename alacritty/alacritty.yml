# Color
import:
  #- ~/.config/alacritty/colors-material.yml
  # uncomment the flavour you want below:
  #~/.config/alacritty/catppuccin/catppuccin-mocha.yml
  # ~/.config/alacritty/catppuccin/catppuccin-macchiato.yml
  - ~/.config/alacritty/catppuccin/catppuccin-frappe.yml
  # - ~/.config/alacritty/catppuccin/catppuccin-latte.yml


## env vars
env:
  TERM: xterm-256color

# window settings
window:
  opacity: 0.9
  padding:
    x: 15
    y: 10

# Class (window name)
#class:
#  instance: Alacritty
#  general: Alacritty

# Scrolling
scrolling:
  history: 10000
  multiplier: 3

# Visual
#visual_bell:
#  animation: EaseOutExpo
#  duration: 0.5
#  color: "#e4c9af"

# Selection?
selection:
  semantic_escape_chars: ",│`|:\"' ()[]{}<>\t"
  save_to_clipboard: true

# writing thing (cursor) 
cursor:
  style: 'Block'

# def Shell
shell:
  program: /usr/bin/zsh
  args:
    - --login

# Font stuff
font:
  normal:
    family: FiraCode Nerd Font
    style: Regular

  bold:
    family: FiraCode Nerd Font
    style: Bold

  italic:
    family: FiraCode Nerd Font
    style: Italic

  bold_italic:
    family: FiraCode Nerd Font
    style: Bold Italic

  size: 16


  glyph_offset:
    x: 0
    y: 0

# Mouse config
mouse:
#  double_click: { threshold: 300 }
#  triple_click: { threshold: 300 }
  hide_when_typing: true

# General config
live_config_reload: true
draw_bold_text_with_bright_colors: true

# Colors
colors:
  primary:
    background: '0x1e1e2e'
    foreground: '0xcdd6f4'
  normal:
    black:   '0x45475a'
    red:     '0xf38ba8'
    green:   '0xa6e3a1'
    yellow:  '0xf9e2af'
    blue:    '0x89b4fa'
    magenta: '0xf5c2e7'
    cyan:    '0x94e2d5'
    white:   '0xbac2de'

