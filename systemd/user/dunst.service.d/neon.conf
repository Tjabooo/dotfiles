# dunst + glycin segfaults when an app deletes its temp notification image while dunst is
# still loading it (8 crashes in the last 2 weeks here). Come straight back, allow bursts,
# and don't write a core dump each time (systemd-coredump still logs every crash).
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=30

[Service]
Restart=on-failure
RestartSec=1
LimitCORE=0
